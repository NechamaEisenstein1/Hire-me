version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hire-me-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hire_me}
      POSTGRES_USER: ${POSTGRES_USER:-hire_me}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hire_me_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hire_me} -d ${POSTGRES_DB:-hire_me}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hire-me-backend
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hire_me}:${POSTGRES_PASSWORD:-hire_me_password}@postgres:5432/${POSTGRES_DB:-hire_me}
      APP_ENV: ${APP_ENV:-development}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-replace-with-strong-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRES_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRES_MINUTES:-30}
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-120}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
      GITHUB_USERNAME: ${GITHUB_USERNAME:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      AI_VERIFY_TLS: ${AI_VERIFY_TLS:-true}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hire-me-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: hire-me-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - local-ai

volumes:
  postgres_data:
  ollama_data:

name: Infra Apply

on:
  workflow_dispatch:

concurrency:
  group: infra-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Bootstrap Terraform state bucket and lock table
        run: |
          # Create S3 state bucket — skip only if it already exists (409), fail on other errors
          if ! aws s3api head-bucket --bucket hire-me-terraform-state-295552411541 2>/dev/null; then
            aws s3api create-bucket \
              --bucket hire-me-terraform-state-295552411541 \
              --region eu-north-1 \
              --create-bucket-configuration LocationConstraint=eu-north-1
          fi

          # Create DynamoDB lock table — skip only if it already exists
          if ! aws dynamodb describe-table --table-name hire-me-terraform-state-lock --region eu-north-1 2>/dev/null; then
            aws dynamodb create-table \
              --table-name hire-me-terraform-state-lock \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region eu-north-1
          fi

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: infra/terraform
        env:
          TF_VAR_aws_region: eu-north-1
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_vpc_id: ${{ secrets.TF_VAR_VPC_ID }}
          TF_VAR_private_subnet_ids: ${{ secrets.TF_VAR_PRIVATE_SUBNET_IDS }}
          TF_VAR_aws_account_id: ${{ secrets.TF_VAR_AWS_ACCOUNT_ID }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        working-directory: infra/terraform
        env:
          TF_VAR_aws_region: eu-north-1
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_vpc_id: ${{ secrets.TF_VAR_VPC_ID }}
          TF_VAR_private_subnet_ids: ${{ secrets.TF_VAR_PRIVATE_SUBNET_IDS }}
          TF_VAR_aws_account_id: ${{ secrets.TF_VAR_AWS_ACCOUNT_ID }}
        run: terraform apply -input=false tfplan

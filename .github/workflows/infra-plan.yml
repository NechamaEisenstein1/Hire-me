name: Infra Plan

on:
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infra-plan.yml'

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      infra_exists: ${{ steps.detect.outputs.infra_exists }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect infra project
        id: detect
        shell: bash
        run: |
          if [ -d infra/terraform ] && ls infra/terraform/*.tf >/dev/null 2>&1; then
            echo "infra_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra_exists=false" >> "$GITHUB_OUTPUT"
            echo "Infra Terraform directory not found on this branch, skipping infra plan by design."
          fi

  plan:
    needs: preflight
    if: ${{ needs.preflight.outputs.infra_exists == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Fmt
        working-directory: infra/terraform
        run: terraform fmt -check
      - name: Init
        working-directory: infra/terraform
        run: terraform init -input=false
      - name: Validate
        working-directory: infra/terraform
        run: terraform validate
      - name: Plan
        working-directory: infra/terraform
        run: terraform plan -input=false

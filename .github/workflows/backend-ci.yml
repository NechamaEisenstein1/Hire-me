name: Backend CI

# Preflight keeps branch-scoped PRs green when backend is absent.

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      backend_exists: ${{ steps.detect.outputs.backend_exists }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect backend project
        id: detect
        shell: bash
        run: |
          if [ -f backend/pyproject.toml ]; then
            echo "backend_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend_exists=false" >> "$GITHUB_OUTPUT"
            echo "Backend directory not found on this branch, skipping backend lint/type-check by design."
          fi

  lint:
    needs: preflight
    if: ${{ needs.preflight.outputs.backend_exists == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: pip install poetry==1.8.5
      - name: Install deps
        working-directory: backend
        run: poetry install --no-interaction --no-ansi
      - name: Lint
        working-directory: backend
        run: poetry run ruff check app
      - name: Type check
        working-directory: backend
        run: poetry run mypy app
